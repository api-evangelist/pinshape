description: Pinshape is an online marketplace and community for 3D-printable designs, where
  makers, designers, and hobbyists browse, download, and sell STL and other printable model files
  for use on desktop 3D printers. The platform hosts both free and premium designs across
  categories such as toys, gadgets, art, jewelry, and functional parts, and was acquired by
  desktop 3D-printing manufacturer Formlabs. This profile was surfaced as a venture portfolio lead
  and enriched through the API Evangelist network; Pinshape publishes no public developer API.
